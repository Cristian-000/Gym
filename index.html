<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker Pro - Cristian</title>
    <style>
        :root {
            --primary: #d4ff00; 
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --text: #ffffff;
            --accent: #ff4444;
            --success: #2ecc71;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none; /* Evita seleccionar texto al tocar rápido */
        }

        /* Cronómetro Fijo */
        .timer-container {
            position: sticky;
            top: 0;
            width: 100%;
            background-color: rgba(26, 26, 26, 0.98);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            z-index: 1000;
            text-align: center;
            border-bottom: 3px solid var(--primary);
        }

        #display {
            font-size: 3.2rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            margin-bottom: 10px;
            color: var(--primary);
            text-shadow: 0 0 15px rgba(212, 255, 0, 0.2);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 0 10px;
        }

        .controls button {
            border: none;
            padding: 15px;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s;
            flex: 1;
            max-width: 150px;
        }

        .btn-start { background: var(--primary); color: black; }
        .btn-pause { background: #ffcc00; color: black; }
        .btn-reset { background: #333; color: white; }

        /* Contenido */
        .content {
            width: 92%;
            max-width: 500px;
            padding: 20px 0 100px 0;
        }

        select {
            width: 100%;
            padding: 15px;
            background: var(--card-bg);
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            outline: none;
        }

        .message {
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #bbb;
        }

        /* Tarjetas de Ejercicios */
        .exercise-card {
            background: var(--card-bg);
            margin-bottom: 12px;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #333;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .exercise-card.completed {
            opacity: 0.4;
            border-color: var(--success);
            transform: scale(0.98);
        }

        .exercise-card.completed h3 {
            text-decoration: line-through;
            color: var(--success);
        }

        .exercise-card h3 {
            margin: 0 0 5px 0;
            font-size: 1.25rem;
            color: var(--primary);
        }

        .reps-info {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .special-method {
            display: inline-block;
            margin-top: 8px;
            background: #441111;
            color: #ff6666;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            border: 1px solid var(--accent);
        }

        .note {
            display: block;
            color: #888;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        /* Feedback de toque */
        .exercise-card:active {
            background: #222;
        }

        @media (max-width: 400px) {
            #display { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="timer-container">
        <div id="display">00:00:00</div>
        <div class="controls">
            <button onclick="toggleTimer()" id="mainBtn" class="btn-start">Iniciar</button>
            <button onclick="resetTimer()" class="btn-reset">Reset</button>
        </div>
    </div>

    <div class="content">
        <select id="routineSelect" onchange="loadRoutine()">
            <option value="empuje1">🔥 Empuje y Cuádriceps - Día 1</option>
            <option value="tiron1">💪 Tirón y Femoral - Día 1</option>
            <option value="empuje2">🔥 Empuje y Cuádriceps - Día 2</option>
            <option value="tiron2">💪 Tirón y Femoral - Día 2</option>
        </select>

        <div id="routineDisplay"></div>
    </div>

    <script>
        const routines = {
            empuje1: {
                message: "Enfócate en la conexión mente-músculo",
                exercises: [
                    { name: "Sentadilla", reps: "4x8" },
                    { name: "Prensa / Sissy / Camilla", reps: "3x15", note: "Elige una opción" },
                    { name: "Press plano (Barra o Mancuerna)", reps: "3x8" },
                    { name: "Aperturas planas", reps: "3x12" },
                    { name: "Vuelos laterales", reps: "3x8", special: "Triserie descendente" },
                    { name: "Triceps polea", reps: "2x10 y 1x6", special: "Controlar el peso" }
                ]
            },
            tiron1: {
                message: "Mantén la espalda neutra en el peso muerto",
                exercises: [
                    { name: "Peso muerto", reps: "4x8" },
                    { name: "Camilla femoral / Plancha femoral", reps: "3x15" },
                    { name: "Dominadas", reps: "4x10" },
                    { name: "Posterior de hombros", reps: "3x8", special: "Triserie descendente" },
                    { name: "Trapecio mancuernas", reps: "3x12" },
                    { name: "Biceps barra Z / Martillo", reps: "2x10, 1x15, 1x6" }
                ]
            },
            empuje2: {
                message: "Día de volumen e intensidad",
                exercises: [
                    { name: "Estocadas caminando", reps: "4 x 30 pasos" },
                    { name: "Camilla / Prensa / Sissy", reps: "3x15" },
                    { name: "Press inclinado", reps: "4x8 o 3x8" },
                    { name: "Press militar", reps: "3x8" },
                    { name: "Triceps barra Z / a la frente", reps: "3x10, 1x15" }
                ]
            },
            tiron2: {
                message: "Controla el descenso en las búlgaras",
                exercises: [
                    { name: "Prensa sumo", reps: "4x8" },
                    { name: "Búlgaras", reps: "3x15" },
                    { name: "Remo (Barra o Mancuerna)", reps: "4x8" },
                    { name: "Trapecio Haney", reps: "3x10" },
                    { name: "Hombro posterior", reps: "3x8", special: "Triserie descendente" },
                    { name: "Biceps (Mancuerna, Martillo o Scott)", reps: "3x12" }
                ]
            }
        };

        // Lógica de Rutina
        function loadRoutine() {
            const select = document.getElementById('routineSelect');
            const selected = select.value;
            localStorage.setItem('lastRoutine', selected); // Guardar preferencia
            
            const data = routines[selected];
            const display = document.getElementById('routineDisplay');

            let html = `<div class="message">${data.message}</div>`;
            data.exercises.forEach((ex, index) => {
                html += `
                    <div class="exercise-card" onclick="toggleComplete(this)">
                        <h3>${ex.name}</h3>
                        <div class="reps-info">${ex.reps}</div>
                        ${ex.special ? `<div class="special-method">${ex.special}</div>` : ''}
                        ${ex.note ? `<span class="note">${ex.note}</span>` : ''}
                    </div>
                `;
            });
            display.innerHTML = html;
        }

        function toggleComplete(card) {
            card.classList.toggle('completed');
            // Feedback vibración si el móvil lo soporta
            if (window.navigator.vibrate) window.navigator.vibrate(50);
        }

        // Lógica de Cronómetro Mejorada
        let startTime, elapsedTime = 0, timerInterval;
        let isRunning = false;

        function timeToString(time) {
            let hh = Math.floor(time / 3600000);
            let mm = Math.floor((time % 3600000) / 60000);
            let ss = Math.floor((time % 60000) / 1000);
            return `${hh.toString().padStart(2, "0")}:${mm.toString().padStart(2, "0")}:${ss.toString().padStart(2, "0")}`;
        }

        function toggleTimer() {
            const btn = document.getElementById("mainBtn");
            if (!isRunning) {
                // Iniciar/Reanudar
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(() => {
                    elapsedTime = Date.now() - startTime;
                    document.getElementById("display").innerText = timeToString(elapsedTime);
                }, 1000);
                btn.innerText = "Pausar";
                btn.className = "btn-pause";
                isRunning = true;
            } else {
                // Pausar
                clearInterval(timerInterval);
                btn.innerText = "Reanudar";
                btn.className = "btn-start";
                isRunning = false;
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            elapsedTime = 0;
            isRunning = false;
            document.getElementById("display").innerText = "00:00:00";
            const btn = document.getElementById("mainBtn");
            btn.innerText = "Iniciar";
            btn.className = "btn-start";
        }

        // Inicialización
        window.onload = () => {
            const saved = localStorage.getItem('lastRoutine');
            if (saved) document.getElementById('routineSelect').value = saved;
            loadRoutine();
        };
    </script>
</body>
</html>
