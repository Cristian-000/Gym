<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker Pro - Cristian</title>
    <style>
        :root {
            --primary: #d4ff00; 
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --text: #ffffff;
            --accent: #ff4444; /* Para resaltar triseries */
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Cronómetro Fijo y Gigante */
        .timer-container {
            position: sticky;
            top: 0;
            width: 100%;
            background-color: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            z-index: 1000;
            text-align: center;
            border-bottom: 3px solid var(--primary);
        }

        #display {
            font-size: 3.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            margin-bottom: 15px;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(212, 255, 0, 0.3);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .controls button {
            background: var(--primary);
            border: none;
            color: black;
            padding: 18px 35px; /* Botones más grandes */
            font-size: 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: transform 0.1s, background 0.2s;
            flex: 0 1 150px;
        }

        .controls button:active {
            transform: scale(0.95);
        }

        .btn-reset {
            background: #333 !important;
            color: white !important;
        }

        /* Contenido Principal */
        .content {
            width: 92%;
            max-width: 550px;
            padding: 25px 0 100px 0;
        }

        select {
            width: 100%;
            padding: 15px;
            background: var(--card-bg);
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 25px;
            appearance: none;
        }

        .message {
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            margin-bottom: 20px;
            font-style: italic;
            font-size: 0.95rem;
        }

        .exercise-card {
            background: var(--card-bg);
            margin-bottom: 12px;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .exercise-card h3 {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .reps-info {
            font-size: 1.1rem;
            font-weight: 700;
            color: #eee;
        }

        /* Estilo especial para Triseries/Descendentes */
        .special-method {
            display: inline-block;
            margin-top: 5px;
            background: #3a0000;
            color: #ff6666;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            border: 1px solid var(--accent);
        }

        .alt-option {
            color: #888;
            font-size: 0.9rem;
            margin-top: 5px;
            display: block;
        }

        @media (max-width: 400px) {
            #display { font-size: 2.8rem; }
            .controls button { padding: 15px 20px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="timer-container">
        <div id="display">00:00:00</div>
        <div class="controls">
            <button onclick="startStop()" id="startBtn">Iniciar</button>
            <button onclick="reset()" class="btn-reset">Reset</button>
        </div>
    </div>

    <div class="content">
        <select id="routineSelect" onchange="loadRoutine()">
            <option value="empuje1">Empuje y Cuádriceps - Día 1</option>
            <option value="tiron1">Tirón y Femoral - Día 1</option>
            <option value="empuje2">Empuje y Cuádriceps - Día 2</option>
            <option value="tiron2">Tirón y Femoral - Día 2</option>
        </select>

        <div id="routineDisplay"></div>
    </div>

    <script>
        const routines = {
            empuje1: {
                message: "Empuje y cuadriseps día 1",
                exercises: [
                    { name: "Sentadilla", reps: "4x8" },
                    { name: "Prensa / Sissy / Camilla", reps: "3x15", note: "Elige una opción" },
                    { name: "Press plano (Barra o Mancuerna)", reps: "3x8" },
                    { name: "Aperturas planas", reps: "3x12" },
                    { name: "Vuelos laterales", reps: "3x8", special: "Triserie descendente" },
                    { name: "Triceps polea", reps: "2x10 y 1x6", special: "Controlar el peso" }
                ]
            },
            tiron1: {
                message: "Tirón y femoral día 1",
                exercises: [
                    { name: "Peso muerto", reps: "4x8" },
                    { name: "Camilla femoral / Plancha femoral", reps: "3x15" },
                    { name: "Dominadas", reps: "4x10" },
                    { name: "Posterior de hombros", reps: "3x8", special: "Triserie descendente (Polea o Cadera)" },
                    { name: "Trapecio mancuernas", reps: "3x12" },
                    { name: "Biceps barra Z / Martillo", reps: "2x10, 1x15, 1x6" }
                ]
            },
            empuje2: {
                message: "Empuje y cuadriseps día 2",
                exercises: [
                    { name: "Estocadas caminando", reps: "4 series de 30 pasos" },
                    { name: "Camilla / Prensa / Sissy", reps: "3x15" },
                    { name: "Press inclinado (Barra o Mancuerna)", reps: "4x8 o 3x8" },
                    { name: "Press militar (Barra o Mancuerna)", reps: "3x8" },
                    { name: "Triceps barra Z / a la frente", reps: "3x10, 1x15" }
                ]
            },
            tiron2: {
                message: "Tirón y femoral día 2",
                exercises: [
                    { name: "Prensa sumo", reps: "4x8" },
                    { name: "Búlgaras", reps: "3x15" },
                    { name: "Remo (Barra o Mancuerna)", reps: "4x8" },
                    { name: "Trapecio Haney", reps: "3x10" },
                    { name: "Hombro posterior (Máquina o Polea)", reps: "3x8", special: "Triserie descendente" },
                    { name: "Biceps (Mancuerna, Martillo o Scott)", reps: "3x12" }
                ]
            }
        };

        function loadRoutine() {
            const selected = document.getElementById('routineSelect').value;
            const data = routines[selected];
            const display = document.getElementById('routineDisplay');

            let html = `<div class="message">${data.message}</div>`;

            data.exercises.forEach(ex => {
                html += `
                    <div class="exercise-card">
                        <h3>${ex.name}</h3>
                        <div class="reps-info">${ex.reps}</div>
                        ${ex.special ? `<div class="special-method">${ex.special}</div>` : ''}
                        ${ex.note ? `<span class="alt-option">${ex.note}</span>` : ''}
                    </div>
                `;
            });

            display.innerHTML = html;
        }

        // Cronómetro
        let startTime, elapsedTime = 0, timerInterval;

        function timeToString(time) {
            let hh = Math.floor(time / 3600000);
            let mm = Math.floor((time % 3600000) / 60000);
            let ss = Math.floor((time % 60000) / 1000);
            return `${hh.toString().padStart(2, "0")}:${mm.toString().padStart(2, "0")}:${ss.toString().padStart(2, "0")}`;
        }

        function startStop() {
            const btn = document.getElementById("startBtn");
            if (btn.innerText === "Iniciar") {
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(() => {
                    elapsedTime = Date.now() - startTime;
                    document.getElementById("display").innerText = timeToString(elapsedTime);
                }, 1000);
                btn.innerText = "Pausar";
                btn.style.background = "#ffcc00";
            } else {
                clearInterval(timerInterval);
                btn.innerText = "Iniciar";
                btn.style.background = "var(--primary)";
            }
        }

        function reset() {
            clearInterval(timerInterval);
            document.getElementById("display").innerText = "00:00:00";
            elapsedTime = 0;
            const btn = document.getElementById("startBtn");
            btn.innerText = "Iniciar";
            btn.style.background = "var(--primary)";
        }

        window.onload = loadRoutine;
    </script>
</body>
</html>
